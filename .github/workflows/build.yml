name: Gerar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compilar APK Android
        run: |
          # Detecta e entra na pasta do projeto (ex: combustível-ia)
          if [ -f "./settings.gradle.kts" ]; then
            cd .
          else
            TARGET_DIR=$(find . -name "settings.gradle.kts" | head -n 1 | xargs dirname)
            echo "Entrando em: $TARGET_DIR"
            cd "$TARGET_DIR"
          fi
          
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          retention-days: 14
