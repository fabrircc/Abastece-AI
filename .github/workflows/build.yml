name: Gerar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.11.1 (Estável e Compatível)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: false

      - name: Compilar APK Android
        run: |
          # Detecta onde está o arquivo build.gradle.kts do app
          if [ -f "./build.gradle.kts" ]; then
            TARGET_DIR="."
          else
            # Procura a pasta que contém o projeto Android
            TARGET_DIR=$(find . -maxdepth 2 -name "build.gradle.kts" -not -path "./app/*" | head -n 1 | xargs dirname)
          fi
          
          echo "Diretório do projeto detectado: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          # Executa o build utilizando o Gradle 8.11.1 configurado
          gradle assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 14
